<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img" aria-label="Receita.AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="420" height="200" fill="url(#bg)"/>
  <rect width="420" height="200" fill="url(#glow)"/>

  <!-- cutlery + plate, centered as a group around x=210 -->
  <g transform="translate(210 86)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">

    <!-- plate -->
    <circle r="46" stroke-width="4" stroke-opacity="0.95"/>
    <circle r="31" stroke-width="3" stroke-opacity="0.5"/>

    <!-- fork (left, close to plate) -->
    <g transform="translate(-72 0)" stroke-width="3.5" stroke-opacity="0.92">
      <line x1="-7" y1="-30" x2="-7" y2="-14"/>
      <line x1="0"  y1="-30" x2="0"  y2="-14"/>
      <line x1="7"  y1="-30" x2="7"  y2="-14"/>
      <path d="M-9 -14 H9 V-9 a9 9 0 0 1 -18 0 Z" fill="#ffffff" fill-opacity="0.92" stroke="none"/>
      <line x1="0" y1="-5" x2="0" y2="31"/>
    </g>

    <!-- knife (right, close to plate) -->
    <g transform="translate(72 0)" stroke-width="3.5" stroke-opacity="0.92">
      <path d="M0 -30 C9 -24 9 -10 0 -6 Z" fill="#ffffff" fill-opacity="0.92" stroke="none"/>
      <line x1="0" y1="-6" x2="0" y2="31"/>
    </g>

    <!-- AI sparkle on the plate -->
    <g fill="#ffffff" stroke="none">
      <path d="M0 -20 C2 -7 7 -2 20 0 C7 2 2 7 0 20 C-2 7 -7 2 -20 0 C-7 -2 -2 -7 0 -20 Z"/>
      <path d="M22 -26 C23 -21 25 -19 30 -18 C25 -17 23 -15 22 -10 C21 -15 19 -17 14 -18 C19 -19 21 -21 22 -26 Z" fill-opacity="0.85"/>
    </g>
  </g>

  <text x="210" y="178" text-anchor="middle" font-family="Segoe UI, Sora, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0.5">Receita<tspan fill="#c7f9ff">.AI</tspan></text>
</svg>
